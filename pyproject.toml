# Cấu hình công cụ cho dự án (không phải metadata đóng gói — dependencies nằm ở requirements.txt).
# Mục đích: để mọi phiên AI/agent chạy cùng một chuẩn lint, type-check và test.

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # độ dài dòng đã kiểm soát bằng line-length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/", "venv/", "tests/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "payos.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "db: test cần cơ sở dữ liệu cloud (tự động SKIP nếu thiếu biến TEST_DATABASE_URL)",
    "integration: test tích hợp gọi API qua httpx ASGI transport",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
